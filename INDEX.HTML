<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creating and Removing Elements</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background: white;
        padding: 20px;
      }
      button {
        width: auto;
        padding: 8px 16px;
        margin: 5px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        transform: 0.3s ease;
        background: pink;
        color: white;
        transition: 0.3s ease;
      }

      button:hover {
        background: pink;
      }
      .btnEdit {
        background: orange;
      }
      .btnEdit:hover {
        background: red;
        transform: scale(1.05);
      }
      .btnDel {
        background: red;
      }
      .btnDel:hover {
        background: red;
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <div class="todo-container">
      <button onclick="addParagraph()">Add Paragraph</button>
      <button onclick="removeLastParagraph()">Remove last Paragraph</button>

      <div id="paragraphlist"></div>
    </div>

    <script>
      //store all paragraphs
      let paragraphs = [];

      // To add new paragraph
      function addParagraph() {
        paragraphs.push("This is a new paragraph");
        render();
      }
      // to remove the last paragraph
      function removeLastParagraph() {
        let list = document.getElementById("paragraphlist");
        // to remove last element from list
        if (list.lastElementChild) {
          list.removeChild(list.lastElementChild);
          paragraphs.pop();
        }
      }

      //to update the display area
      function render() {
        let list = document.getElementById("paragraphlist");
        list.innerHTML = "";
        //creating the tags for each paragraph
        paragraphs.forEach((paragraph, index) => {
          let paragraphElement = document.createElement("p");
          paragraphElement.textContent = paragraph;
          // add parargraph
          list.appendChild(paragraphElement);
        });
      }
    </script>
  </body>
</html>
